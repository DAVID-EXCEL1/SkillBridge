<div class="app-shell">
  <app-sidebar></app-sidebar>
  <div class="app-shell-content" style="max-width: 560px;">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <h1 class="h3 mb-0"><i class="bi bi-gear me-2"></i>Settings</h1>
    </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <h5 class="card-title mb-3">Change Password</h5>

      <div class="mb-3">
        <label class="form-label">Current Password</label>
        <input type="password" class="form-control" [(ngModel)]="currentPassword">
      </div>
      <div class="mb-3">
        <label class="form-label">New Password</label>
        <input type="password" class="form-control" [(ngModel)]="newPassword">
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm New Password</label>
        <input type="password" class="form-control" [(ngModel)]="confirmPassword">
      </div>

      @if (message) {
        <div class="alert py-2" [ngClass]="success ? 'alert-success' : 'alert-warning'">{{ message }}</div>
      }

      <button class="btn btn-primary w-100" [disabled]="saving" (click)="changePassword()">
        {{ saving ? 'Saving...' : 'Change Password' }}
      </button>
    </div>
  </div>
  </div>
</div>
