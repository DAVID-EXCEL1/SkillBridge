<div class="app-shell">
  <app-sidebar></app-sidebar>
  <div class="app-shell-content" style="max-width: 720px;">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <h1 class="h3 mb-0"><i class="bi bi-bell me-2"></i>Notifications</h1>
    </div>

  @if (loading) {
    <p class="text-muted">Loading...</p>
  } @else if (items.length === 0) {
    <div class="alert alert-light border">Nothing new right now.</div>
  }

  <div class="d-flex flex-column gap-2">
    @for (item of items; track $index) {
      <a class="card shadow-sm text-decoration-none text-dark" [routerLink]="item.link" [queryParams]="item.queryParams">
        <div class="card-body d-flex align-items-center gap-3">
          <i class="bi {{item.icon}} fs-4 text-primary"></i>
          <div class="flex-grow-1">
            <div>{{ item.text }}</div>
            <div class="text-muted small">{{ item.when | date:'medium' }}</div>
          </div>
        </div>
      </a>
    }
  </div>
  </div>
</div>
