<div class="app-shell">
  <app-sidebar></app-sidebar>
  <div class="app-shell-content" style="max-width: 960px;">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <h1 class="h3 mb-0"><i class="bi bi-chat-left-text me-2"></i>Messages</h1>
    </div>

  <div class="row g-3">
    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="list-group list-group-flush" style="max-height: 500px; overflow-y: auto;">
          @for (c of conversations; track c.other_user_id) {
            <button type="button" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
              [class.active]="activeOtherUserId === c.other_user_id"
              (click)="open(c.other_user_id)">
              <span>{{ c.first_name }} {{ c.last_name }}</span>
              @if (c.unread_count > 0) {
                <span class="badge bg-danger rounded-pill">{{ c.unread_count }}</span>
              }
            </button>
          } @empty {
            <div class="list-group-item text-muted">No conversations yet.</div>
          }
        </div>
      </div>
    </div>

    <div class="col-md-8">
      <div class="card shadow-sm h-100">
        @if (!activeOtherUserId) {
          <div class="card-body text-muted">Select a conversation to view messages.</div>
        } @else {
          <div class="card-body d-flex flex-column" style="height: 500px;">
            <div class="flex-grow-1 overflow-auto mb-2 d-flex flex-column gap-2">
              @for (m of messages; track m.chat_id) {
                <div class="d-flex" [class.justify-content-end]="isMine(m)">
                  <div class="p-2 rounded" [ngClass]="isMine(m) ? 'bg-primary text-white' : 'bg-light border'"
                    style="max-width: 75%;">
                    {{ m.message }}
                  </div>
                </div>
              }
            </div>
            <div class="d-flex gap-2">
              <input type="text" class="form-control" placeholder="Type a message..."
                [(ngModel)]="draft" (keyup.enter)="send()">
              <button class="btn btn-primary" (click)="send()">
                <i class="bi bi-send"></i>
              </button>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
  </div>
</div>
